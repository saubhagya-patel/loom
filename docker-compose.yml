# Local development dependencies only. The application runs on the host
# (`npm run dev`), so there is no app service here and no Dockerfile in V1.
#
# These credentials are development defaults and match backend/.env.example.
# They are in version control because nothing here is reachable off localhost;
# never reuse them anywhere real.

services:
  mysql:
    image: mysql:8.0
    container_name: luma-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: luma
      MYSQL_USER: luma
      MYSQL_PASSWORD: luma
    ports:
      # 3307 on the host: Convergence's MySQL already owns 3306, and both
      # projects should be able to run at once. Bound to 127.0.0.1 rather than
      # 0.0.0.0 so a development database with default credentials is not
      # reachable from the local network.
      - '127.0.0.1:3307:3306'
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      # -h 127.0.0.1 forces TCP, exercising the same path the app uses rather
      # than the unix socket.
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-uluma', '-pluma']
      interval: 5s
      timeout: 5s
      retries: 12
      # First boot initialises the data directory, which takes far longer than
      # a normal start; without this the retries expire before MySQL is up.
      start_period: 40s

volumes:
  mysql-data:
